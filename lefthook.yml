pre-commit:
  parallel: true
  jobs:
    - name: jscheck
      run: pnpm rr jscheck --fix-staged
      stage_fixed: true

    - name: tscheck
      run: pnpm --filter=@vlandoss/env exec rr tsc
      glob:
        - "package/**/*.{ts,tsx}"
        - "package/tsconfig.json"

pre-push:
  jobs:
    - name: test
      run: pnpm --filter=@vlandoss/env test
