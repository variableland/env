[tools]
deno = "2"
node = "24"  # for `rr` (run-run) and `playwright` test runner; the server itself runs on Deno
bun = "1.2.4"  # used only to hydrate `node_modules/` — Deno can't extract `file:` tarballs (bun does, with a flat layout Deno can read)

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Hydrate node_modules with bun (Deno can't extract `file:` tarballs); Deno reads it via nodeModulesDir: 'manual'"
sources = [
  "package.json",
  "bun.lock",
  "deno.jsonc",
  "{{config_root}}/../../package/.local/vlandoss-env.tgz",
]
run = [
  "mise run //:env:pack",
  "bun install",
]

[tasks.reinstall]
description = "Force-reinstall the env tarball"
run = [
  "mise run //:env:pack",
  "bun install --force",
]

[tasks.start]
depends = ["install"]
run = "deno run --allow-net --allow-env --allow-read src/server.ts"

[tasks."test:e2e"]
description = "Playwright (node) drives a Deno-launched webServer"
depends = ["install"]
run = "playwright test"

[tasks.check]
description = "JS & TS check"
depends = ["install"]
run = "rr check"
